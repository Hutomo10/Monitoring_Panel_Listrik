<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Panel Listrik 3 Fasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#c9cdd1; --panel:#eceef0; --ink:#1b2229; --muted:#59646e;
      --steel:#35404b; --line:#87909a; --ok-zone:#dde1e4;
      --warn:#d99a00; --alarm:#c0262d; --live:#2e8b57;
      --label:'Barlow Condensed','Arial Narrow',sans-serif;
      --body:'Barlow Semi Condensed','Segoe UI',Arial,sans-serif;
      --mono:'IBM Plex Mono',Consolas,monospace;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.4; }
    :focus-visible { outline:3px solid #1b6fd1; outline-offset:2px; }

    .banner { display:none; background:var(--alarm); color:#fff; font-weight:600; padding:10px 24px; }
    .banner.show { display:block; }
    .banner.error { background:#6b7580; }

    .top { background:var(--steel); color:#fff; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 24px; padding:12px 24px; border-bottom:4px solid #1f2830; }
    .top h1 { margin:0; font-family:var(--label); font-weight:700; font-size:1.7rem; }
    .top .site { color:#aeb8c2; font-size:.95rem; }
    .clock { text-align:right; font-family:var(--label); font-weight:600; font-size:1.8rem; line-height:1; font-variant-numeric:tabular-nums; }
    .clock small { display:block; font-family:var(--body); font-weight:400; font-size:.85rem; color:#aeb8c2; margin-top:4px; }

    main { max-width:1280px; margin:0 auto; padding:20px 24px 32px; }

    .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin:0 0 20px; }
    .strip > div { background:var(--panel); padding:10px 16px; }
    .strip dt { color:var(--muted); font-size:.9rem; }
    .strip dd { margin:2px 0 0; font-family:var(--label); font-weight:600; font-size:1.5rem; display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
    .strip dd small { font-family:var(--body); font-weight:400; font-size:.9rem; color:var(--muted); }
    .lamp { width:14px; height:14px; border-radius:50%; background:#9aa3ab; border:2px solid #6b747c; flex:none; }
    .lamp.online { background:var(--live); border-color:#1d5c39; }
    .lamp.stale  { background:var(--warn); border-color:#8a6300; }
    .lamp.error  { background:var(--alarm); border-color:#7d1519; }

    .phases { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:16px; }
    .card { background:var(--panel); border:1px solid var(--line); }
    .card > header { background:var(--steel); color:#fff; display:flex; justify-content:space-between; align-items:center; padding:6px 12px; font-family:var(--label); }
    .card > header .name { font-weight:600; font-size:1.25rem; }
    .card > header .st { font-weight:600; font-size:1rem; padding:1px 10px; background:#55616d; }
    .card.warn > header { background:var(--warn); color:var(--ink); }
    .card.warn > header .st { background:#b88100; color:#fff; }
    .card.alarm > header { background:var(--alarm); }
    .card.alarm > header .st { background:#8f1a20; }
    .card.na > header .st { background:#6b7580; }

    .meter { padding:10px 16px; border-bottom:1px solid #d0d4d8; }
    .mh { display:flex; align-items:baseline; gap:8px; }
    .mh .lbl { flex:1; font-family:var(--label); font-weight:600; font-size:1.05rem; color:var(--muted); }
    .mh .mv { font-family:var(--label); font-weight:600; font-size:2.4rem; line-height:1; font-variant-numeric:tabular-nums; }
    .mh .mu { font-family:var(--label); font-size:1.1rem; color:var(--muted); }
    .bar { height:10px; background:var(--ok-zone); border:1px solid var(--line); margin:6px 0 2px; position:relative; }
    .bar > i { position:absolute; left:0; top:0; bottom:0; width:0; background:#1f4e79; transition:width .5s; }
    .meter.warn .bar > i { background:var(--warn); }
    .meter.alarm .bar > i { background:var(--alarm); }
    .meter.na .bar > i { background:#9aa3ab; }
    .meter.warn .mv { color:#8a6300; }
    .meter.alarm .mv { color:var(--alarm); }
    .meter.na .mv { color:#8a949d; }
    .rng { font-size:.8rem; color:var(--muted); }

    .mini { display:grid; grid-template-columns:1fr 1fr; margin:0; border-top:1px solid var(--line); }
    .mini > div { padding:8px 16px; border-right:1px solid var(--line); border-bottom:1px solid #d0d4d8; }
    .mini > div:nth-child(2n) { border-right:0; }
    .mini dt { font-size:.82rem; color:var(--muted); }
    .mini dd { margin:0; font-family:var(--label); font-weight:600; font-size:1.15rem; font-variant-numeric:tabular-nums; }

    .panel { background:var(--panel); border:1px solid var(--line); margin-top:20px; }
    .panel > header { background:var(--steel); color:#fff; padding:6px 12px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; font-family:var(--label); }
    .panel > header h2 { margin:0; font-weight:600; font-size:1.2rem; }
    .seg { display:flex; flex-wrap:wrap; gap:2px; }
    .seg button { border:0; background:#55616d; color:#fff; padding:3px 12px; cursor:pointer; font-family:var(--label); font-weight:500; font-size:1rem; }
    .seg button[aria-pressed="true"] { background:#fff; color:var(--ink); }
    .chartwrap { padding:12px 16px 4px; }
    #trend { width:100%; height:300px; display:block; touch-action:pan-y; }
    .readout { padding:4px 16px 12px; font-family:var(--mono); font-size:.85rem; color:var(--muted); min-height:1.9em; }

    .logwrap { max-height:260px; overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:.95rem; }
    th { text-align:left; position:sticky; top:0; background:#dfe3e6; font-weight:600; padding:6px 16px; border-bottom:1px solid var(--line); }
    td { padding:6px 16px; border-bottom:1px solid #d0d4d8; vertical-align:top; }
    td.t { font-family:var(--mono); font-size:.85rem; white-space:nowrap; color:var(--muted); }
    .lv { display:inline-block; min-width:5.2em; text-align:center; padding:0 8px; font-weight:600; font-size:.85rem; color:#fff; background:#6b7580; }
    .lv.alarm { background:var(--alarm); } .lv.warn { background:var(--warn); color:var(--ink); } .lv.ok { background:var(--live); }
    .empty { padding:18px 16px; color:var(--muted); }
    footer { margin-top:18px; color:var(--muted); font-size:.9rem; }

    @media (max-width:600px) {
      .top, main { padding-left:12px; padding-right:12px; }
      .mh .mv { font-size:2rem; }
      #trend { height:240px; }
    }
  </style>
</head>
<body>
  <div class="banner" id="banner" role="alert" aria-live="assertive"></div>

  <div class="top">
    <div>
      <h1>Monitoring Panel Listrik 3 Fasa</h1>
      <div class="site" id="site"></div>
    </div>
    <div class="clock"><span id="clock">--:--:--</span><small id="date">-</small></div>
  </div>

  <main>
    <dl class="strip">
      <div><dt>Komunikasi</dt><dd><i class="lamp" id="lamp"></i><span id="comm">Menghubungkan</span></dd></div>
      <div><dt>Alarm aktif</dt><dd id="nAlarm">--</dd></div>
      <div><dt>Peringatan aktif</dt><dd id="nWarn">--</dd></div>
      <div><dt>Daya total</dt><dd id="totP">--</dd></div>
      <div><dt>Data terakhir</dt><dd><span id="lastT">--:--:--</span><small id="age"></small></dd></div>
    </dl>

    <section class="phases" id="phases" aria-label="Pembacaan per fasa"></section>

    <section class="panel">
      <header>
        <h2>Tren data</h2>
        <div class="seg" id="seg" role="group" aria-label="Pilih grafik"></div>
      </header>
      <div class="chartwrap"><canvas id="trend" role="img" aria-label="Grafik tren"></canvas></div>
      <div class="readout" id="readout"></div>
    </section>

    <section class="panel">
      <header><h2>Catatan kejadian</h2></header>
      <div class="logwrap" id="logwrap"></div>
    </section>

    <footer id="foot"></footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    /* ================= KONFIGURASI ================= */
    const CFG = {
      SITE: "Lokasi: Kalimantan",
      PANEL_PATH: "panel/esp32_panel",
      HISTORY_PATH: "history/esp32_panel",
      HISTORY_POINTS: 120,
      OFFLINE_AFTER_MS: 60000,      // ESP32 dianggap mati jika tidak kirim data selama ini
      TARIF_PER_KWH: 1444.70        // Rp per kWh, sesuaikan dengan tarif PLN Anda
    };

    /* Batas alarm per fasa. loA/hiA = alarm, loW/hiW = peringatan */
    const LIM = {
      V: { name:"Tegangan", unit:"V", dec:1, min:0, max:300,  loA:198, loW:207, hiW:233, hiA:242 },
      I: { name:"Arus",     unit:"A", dec:2, min:0, max:20,   hiW:12,  hiA:16 },
      P: { name:"Daya",     unit:"W", dec:0, min:0, max:4000, hiW:2400, hiA:3000 }
    };
    /* Batas untuk total 3 fasa (nilai dalam W) */
    const LIM_TOT_P = { name:"Daya total", unit:"kW", dec:2, min:0, max:12000, hiW:7200, hiA:9000 };
    const LIM_IMB   = { name:"Ketidakseimbangan arus", unit:"%", dec:1, min:0, max:50, hiW:10, hiA:20 };

    const PH = ["L1", "L2", "L3"];
    const PH_COLOR = ["#1f4e79", "#b87a00", "#2e8b57"];

    /* Grafik yang bisa dipilih */
    const GROUPS = {
      V:  { title:"Tegangan",      keys:["V1","V2","V3"], unit:"V",   dec:1, lim:LIM.V },
      I:  { title:"Arus",          keys:["I1","I2","I3"], unit:"A",   dec:2, lim:LIM.I },
      P3: { title:"Daya per fasa", keys:["P1","P2","P3"], unit:"W",   dec:0, lim:LIM.P },
      PT: { title:"Daya total",    keys:["PT"],           unit:"W",   dec:0, lim:null },
      ET: { title:"Energi",        keys:["ET"],           unit:"kWh", dec:3, lim:null }
    };
    let trendG = "V";
    /* ============================================== */

    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, "0");
    const hms = d => pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    const dmy = d => d.toLocaleDateString("id-ID", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
    const fmt = (v, d) => (v == null || isNaN(v)) ? "--" : Number(v).toFixed(d);
    const rupiah = v => "Rp " + Math.round(v).toLocaleString("id-ID");
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const RANK = { na:-1, ok:0, warn:1, alarm:2 };
    const STATE_TXT = { ok:"Normal", warn:"Peringatan", alarm:"Alarm", na:"Tidak ada data" };

    let live = null, hist = [], hoverI = null;
    let dbOk = true, prevComm = null, log = [];
    const prevSt = {};

    function stateOf(l, v) {
      if (v == null) return "na";
      if ((l.loA != null && v < l.loA) || (l.hiA != null && v > l.hiA)) return "alarm";
      if ((l.loW != null && v < l.loW) || (l.hiW != null && v > l.hiW)) return "warn";
      return "ok";
    }

    function rangeText(l, scale = 1) {
      const f = x => +(x / scale).toFixed(2);
      if (l.loA != null && l.hiA != null) return `Batas normal: ${f(l.loA)} – ${f(l.hiA)} ${l.unit}`;
      if (l.hiA != null) return `Batas alarm: ${f(l.hiA)} ${l.unit}`;
      return "";
    }

    /* ---------- Bangun kartu ---------- */
    function buildCards() {
      const phaseCards = PH.map(p => `
        <article class="card na" id="card-${p}">
          <header><span class="name">Fasa ${p}</span><span class="st" id="st-${p}">Tidak ada data</span></header>
          ${["V","I","P"].map(k => `
            <div class="meter na" id="m-${p}-${k}">
              <div class="mh">
                <span class="lbl">${LIM[k].name}</span>
                <span class="mv" id="v-${p}-${k}">--</span>
                <span class="mu">${LIM[k].unit}</span>
              </div>
              <div class="bar"><i id="b-${p}-${k}"></i></div>
              <div class="rng">${rangeText(LIM[k])}</div>
            </div>`).join("")}
          <dl class="mini">
            <div><dt>Energi fasa</dt><dd id="e-${p}">--</dd></div>
            <div><dt>Estimasi biaya</dt><dd id="c-${p}">--</dd></div>
          </dl>
        </article>`).join("");

      const totalCard = `
        <article class="card na" id="card-tot">
          <header><span class="name">Total 3 fasa</span><span class="st" id="st-tot">Tidak ada data</span></header>
          <div class="meter na" id="m-tot-P">
            <div class="mh">
              <span class="lbl">Daya total</span>
              <span class="mv" id="v-tot-P">--</span>
              <span class="mu">kW</span>
            </div>
            <div class="bar"><i id="b-tot-P"></i></div>
            <div class="rng">${rangeText(LIM_TOT_P, 1000)}</div>
          </div>
          <div class="meter na" id="m-tot-IMB">
            <div class="mh">
              <span class="lbl">Ketidakseimbangan arus</span>
              <span class="mv" id="v-tot-IMB">--</span>
              <span class="mu">%</span>
            </div>
            <div class="bar"><i id="b-tot-IMB"></i></div>
            <div class="rng">${rangeText(LIM_IMB)}</div>
          </div>
          <dl class="mini">
            <div><dt>Energi total</dt><dd id="tE">--</dd></div>
            <div><dt>Estimasi biaya</dt><dd id="tC">--</dd></div>
            <div><dt>Tegangan rata-rata</dt><dd id="tV">--</dd></div>
            <div><dt>Pemakaian (grafik)</dt><dd id="tW">--</dd></div>
          </dl>
        </article>`;

      $("phases").innerHTML = phaseCards + totalCard;

      $("seg").innerHTML = Object.keys(GROUPS).map(k =>
        `<button type="button" data-k="${k}" aria-pressed="${k === trendG}">${GROUPS[k].title}</button>`).join("");
      $("seg").onclick = e => {
        const b = e.target.closest("button"); if (!b) return;
        trendG = b.dataset.k; hoverI = null;
        document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
        drawChart();
      };
    }

    /* ---------- Helper update ---------- */
    function setMeter(key, lim, v, st, text) {
      $("m-" + key).className = "meter " + st;
      $("v-" + key).textContent = text;
      const frac = v == null ? 0 : clamp((v - lim.min) / (lim.max - lim.min));
      $("b-" + key).style.width = (frac * 100).toFixed(1) + "%";
    }

    function setCard(cardId, stId, st) {
      $(cardId).className = "card " + st;
      $(stId).textContent = STATE_TXT[st];
    }

    function track(key, label, st, text) {
      if (st === "na") return;
      const was = prevSt[key];
      if (was !== undefined && was !== st) {
        if (st === "alarm") addLog("alarm", `${label} ${text}: melewati batas alarm.`);
        else if (st === "warn") addLog("warn", `${label} ${text}: mendekati batas.`);
        else addLog("ok", `${label} ${text}: kembali normal.`);
      }
      prevSt[key] = st;
    }

    function windowKwh() {
      const e = hist.map(h => h.ET).filter(x => x != null);
      return e.length > 1 ? fmt(e[e.length - 1] - e[0], 3) + " kWh" : "--";
    }

    /* ---------- Log kejadian ---------- */
    function addLog(level, msg) {
      log.unshift({ t: new Date(), level, msg });
      if (log.length > 60) log.pop();
      renderLog();
    }

    function renderLog() {
      const el = $("logwrap");
      if (!log.length) {
        el.innerHTML = '<p class="empty">Belum ada kejadian. Perubahan status alarm dan koneksi akan tercatat di sini.</p>';
        return;
      }
      const names = { alarm:"Alarm", warn:"Peringatan", ok:"Normal", info:"Info" };
      el.innerHTML = '<table><thead><tr><th>Waktu</th><th>Level</th><th>Kejadian</th></tr></thead><tbody>' +
        log.map(r => `<tr><td class="t">${hms(r.t)}</td><td><span class="lv ${r.level}">${names[r.level]}</span></td><td>${r.msg}</td></tr>`).join("") +
        "</tbody></table>";
    }

    /* ---------- Render utama ---------- */
    function renderAll() {
      const now = Date.now();
      const age = live?.ts ? Math.max(0, (now - live.ts) / 1000) : Infinity;

      let comm;
      if (!dbOk) comm = "error";
      else if (!live) comm = "connecting";
      else comm = age * 1000 < CFG.OFFLINE_AFTER_MS ? "online" : "stale";
      const on = comm === "online";

      const ph = live?.phases || {};
      const tot = live?.total || {};
      let nA = 0, nW = 0;
      const alarmTxt = [];
      const count = (st, txt) => {
        if (st === "alarm") { nA++; alarmTxt.push(txt); }
        else if (st === "warn") nW++;
      };

      /* Tiap fasa */
      PH.forEach(p => {
        const d = ph[p] || {};
        let worst = "na";
        ["V","I","P"].forEach(k => {
          const lim = LIM[k];
          const v = d[k] ?? null;
          const st = on ? stateOf(lim, v) : "na";
          const text = fmt(v, lim.dec);
          setMeter(`${p}-${k}`, lim, v, st, text);
          track(`${p}-${k}`, `${p} ${lim.name}`, st, `${text} ${lim.unit}`);
          count(st, `${p} ${lim.name} ${text} ${lim.unit}`);
          if (RANK[st] > RANK[worst]) worst = st;
        });
        $("e-" + p).textContent = d.E == null ? "--" : fmt(d.E, 3) + " kWh";
        $("c-" + p).textContent = d.E == null ? "--" : rupiah(d.E * CFG.TARIF_PER_KWH);
        setCard("card-" + p, "st-" + p, on ? worst : "na");
      });

      /* Total daya */
      const P = tot.P ?? null;
      const stP = on ? stateOf(LIM_TOT_P, P) : "na";
      const pKw = P == null ? "--" : (P / 1000).toFixed(2);
      setMeter("tot-P", LIM_TOT_P, P, stP, pKw);
      track("tot-P", "Daya total", stP, `${pKw} kW`);
      count(stP, `Daya total ${pKw} kW`);

      /* Ketidakseimbangan arus */
      const Is = PH.map(p => ph[p]?.I).filter(x => x != null);
      let imb = null;
      if (Is.length === 3) {
        const avg = Is.reduce((a, b) => a + b, 0) / 3;
        if (avg > 0.5) imb = (Math.max(...Is) - Math.min(...Is)) / avg * 100;
      }
      const stI = on && imb != null ? stateOf(LIM_IMB, imb) : "na";
      setMeter("tot-IMB", LIM_IMB, imb, stI, fmt(imb, 1));
      track("tot-IMB", "Ketidakseimbangan arus", stI, fmt(imb, 1) + " %");
      count(stI, `Ketidakseimbangan arus ${fmt(imb, 1)} %`);

      /* Kartu total */
      const Vs = PH.map(p => ph[p]?.V).filter(x => x != null);
      $("tV").textContent = Vs.length ? fmt(Vs.reduce((a, b) => a + b, 0) / Vs.length, 1) + " V" : "--";
      $("tE").textContent = tot.E == null ? "--" : fmt(tot.E, 3) + " kWh";
      $("tC").textContent = tot.E == null ? "--" : rupiah(tot.E * CFG.TARIF_PER_KWH);
      $("tW").textContent = windowKwh();
      const worstTot = [stP, stI].reduce((a, b) => RANK[b] > RANK[a] ? b : a, "na");
      setCard("card-tot", "st-tot", on ? worstTot : "na");

      /* Strip status */
      const label = { online:"Online", stale:"ESP32 tidak mengirim data", error:"Database tidak terjangkau", connecting:"Menghubungkan" };
      $("comm").textContent = label[comm];
      $("lamp").className = "lamp " + (comm === "connecting" ? "" : comm);
      $("nAlarm").textContent = on ? nA : "--";
      $("nWarn").textContent = on ? nW : "--";
      $("totP").textContent = P == null ? "--" : pKw + " kW";
      $("lastT").textContent = live?.ts ? hms(new Date(live.ts)) : "--:--:--";
      $("age").textContent = live?.ts
        ? (age < 120 ? Math.round(age) + " detik lalu" : Math.round(age / 60) + " menit lalu")
        : "";

      /* Log perubahan koneksi */
      if (prevComm !== null && prevComm !== comm && comm !== "connecting") {
        if (comm === "online") addLog("ok", "Komunikasi pulih. Data diterima kembali dari ESP32.");
        else if (comm === "stale") addLog("warn", "ESP32 berhenti mengirim data. Periksa catu daya dan WiFi.");
        else if (comm === "error") addLog("alarm", "Database Firebase tidak terjangkau.");
      }
      prevComm = comm;

      /* Banner */
      const b = $("banner");
      if (comm === "error") {
        b.textContent = "Database tidak terjangkau. Periksa koneksi internet dan firebase-config.js.";
        b.className = "banner show error";
      } else if (comm === "stale") {
        b.textContent = "Data tidak diperbarui. Nilai yang tampil adalah pembacaan terakhir.";
        b.className = "banner show error";
      } else if (nA > 0) {
        b.textContent = "Alarm aktif: " + alarmTxt.join("; ");
        b.className = "banner show";
      } else {
        b.className = "banner";
      }

      drawChart();
    }

    /* ---------- Grafik tren (multi-garis) ---------- */
    function drawChart() {
      const cv = $("trend"), ctx = cv.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const w = cv.clientWidth, h = cv.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.font = "12px 'Barlow Semi Condensed', sans-serif";

      const g = GROUPS[trendG];
      const pts = hist.filter(p => p.ts != null && g.keys.some(k => p[k] != null));
      if (pts.length < 2) {
        ctx.fillStyle = "#59646e";
        ctx.fillText("Menunggu data. Grafik tampil setelah minimal dua data diterima.", 16, 30);
        $("readout").textContent = "";
        cv._g = null;
        return;
      }

      const vals = pts.flatMap(p => g.keys.map(k => p[k]).filter(v => v != null));
      let lo = Math.min(...vals), hi = Math.max(...vals);
      if (hi - lo < 1e-9) { const m = Math.abs(hi) * 0.05 || 1; lo -= m; hi += m; }
      const padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
      if (g.lim && g.lim.min === 0 && lo < 0) lo = 0;

      const L = 56, R = 14, T = 12, B = 28, cw = w - L - R, ch = h - T - B;
      const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
      const X = t => L + (t - t0) / ((t1 - t0) || 1) * cw;
      const Y = v => T + (1 - (v - lo) / (hi - lo)) * ch;

      /* grid + sumbu */
      ctx.strokeStyle = "#cfd3d7"; ctx.fillStyle = "#59646e"; ctx.lineWidth = 1; ctx.textAlign = "right";
      for (let i = 0; i <= 4; i++) {
        const v = lo + (hi - lo) * i / 4, y = Y(v);
        ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - R, y); ctx.stroke();
        ctx.fillText(v.toFixed(g.dec > 1 ? 2 : g.dec), L - 6, y + 4);
      }
      ctx.textAlign = "center";
      [0, 0.5, 1].forEach(f => ctx.fillText(hms(new Date(t0 + (t1 - t0) * f)), L + cw * f, h - 8));
      ctx.strokeStyle = "#87909a"; ctx.strokeRect(L, T, cw, ch);

      /* garis batas */
      if (g.lim) {
        [[g.lim.hiA,"#c0262d"],[g.lim.loA,"#c0262d"],[g.lim.hiW,"#d99a00"],[g.lim.loW,"#d99a00"]].forEach(([v, c]) => {
          if (v == null || v < lo || v > hi) return;
          ctx.strokeStyle = c; ctx.setLineDash([6, 4]);
          ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(w - R, Y(v)); ctx.stroke();
          ctx.setLineDash([]);
        });
      }

      /* kurva tiap seri */
      g.keys.forEach((k, si) => {
        ctx.strokeStyle = g.keys.length === 1 ? "#1f4e79" : PH_COLOR[si];
        ctx.lineWidth = 2; ctx.lineJoin = "round";
        ctx.beginPath();
        let started = false;
        pts.forEach(p => {
          if (p[k] == null) return;
          const x = X(p.ts), y = Y(p[k]);
          started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          started = true;
        });
        ctx.stroke();
      });

      /* crosshair + titik */
      const idx = hoverI != null ? Math.min(hoverI, pts.length - 1) : pts.length - 1;
      const p = pts[idx], fx = X(p.ts);
      if (hoverI != null) {
        ctx.strokeStyle = "#35404b"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(fx, T); ctx.lineTo(fx, T + ch); ctx.stroke();
      }
      g.keys.forEach((k, si) => {
        if (p[k] == null) return;
        ctx.fillStyle = g.keys.length === 1 ? "#1b2229" : PH_COLOR[si];
        ctx.fillRect(fx - 4, Y(p[k]) - 4, 8, 8);
      });

      const seriesName = si => g.keys.length === 1 ? g.title : PH[si];
      $("readout").textContent =
        `${hms(new Date(p.ts))}   ` +
        g.keys.map((k, si) => `${seriesName(si)} ${fmt(p[k], g.dec)} ${g.unit}`).join("   |   ") +
        (hoverI == null ? "   (data terakhir)" : "");

      cv._g = { L, cw, pts };
    }

    const trend = $("trend");
    trend.addEventListener("pointermove", e => {
      const g = trend._g; if (!g) return;
      const r = trend.getBoundingClientRect();
      const x = e.clientX - r.left;
      const t0 = g.pts[0].ts, t1 = g.pts[g.pts.length - 1].ts;
      const tt = t0 + clamp((x - g.L) / g.cw) * (t1 - t0);
      let best = 0, bd = Infinity;
      g.pts.forEach((p, i) => { const d = Math.abs(p.ts - tt); if (d < bd) { bd = d; best = i; } });
      hoverI = best; drawChart();
    });
    trend.addEventListener("pointerleave", () => { hoverI = null; drawChart(); });
    window.addEventListener("resize", drawChart);

    /* ---------- Firebase ---------- */
    const db = getDatabase(initializeApp(firebaseConfig));

    onValue(ref(db, ".info/connected"), snap => {
      dbOk = snap.val() === true;
      renderAll();
    });

    onValue(ref(db, CFG.PANEL_PATH), snap => {
      live = snap.val();
      renderAll();
    }, err => {
      dbOk = false;
      addLog("alarm", "Gagal membaca data: " + err.message);
      renderAll();
    });

    onValue(query(ref(db, CFG.HISTORY_PATH), limitToLast(CFG.HISTORY_POINTS)), snap => {
      const obj = snap.val() || {};
      hist = Object.keys(obj).sort().map(k => obj[k]);
      renderAll();
    });

    /* ---------- Mulai ---------- */
    function tickClock() {
      const n = new Date();
      $("clock").textContent = hms(n);
      $("date").textContent = dmy(n);
    }

    $("site").textContent = CFG.SITE + ", 3 fasa via ESP32 + 3x PZEM-004T";
    $("foot").textContent = `Sumber data: Firebase Realtime Database (${CFG.PANEL_PATH}). Tampilan diperbarui otomatis.`;
    buildCards();
    renderLog();
    tickClock();
    setInterval(tickClock, 1000);
    setInterval(renderAll, 1000);
  </script>
</body>
</html>
